<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Prototype methane OGI payload front face</title>
  <desc id="desc">Front plate schematic showing a small visible camera aperture, a large LWIR methane aperture, alignment centerlines, fasteners, and labels for the optical stack behind the LWIR lens.</desc>
  <defs>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>

  <text x="480" y="44" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Methane OGI Payload — Front Face</text>
  <text x="480" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#475569">Co-boresighted visible context camera + methane-filtered LWIR optical aperture</text>

  <g filter="url(#shadow)">
    <rect x="156" y="108" width="648" height="332" rx="34" fill="url(#plate)" stroke="#334155" stroke-width="3"/>
    <rect x="180" y="132" width="600" height="284" rx="22" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 8"/>
  </g>

  <!-- Fasteners -->
  <g fill="#64748b" stroke="#334155" stroke-width="1.5">
    <circle cx="204" cy="156" r="10"/>
    <circle cx="756" cy="156" r="10"/>
    <circle cx="204" cy="392" r="10"/>
    <circle cx="756" cy="392" r="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="198" y1="156" x2="210" y2="156"/>
    <line x1="750" y1="156" x2="762" y2="156"/>
    <line x1="198" y1="392" x2="210" y2="392"/>
    <line x1="750" y1="392" x2="762" y2="392"/>
  </g>

  <!-- Visible camera -->
  <g>
    <circle cx="316" cy="236" r="58" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
    <circle cx="316" cy="236" r="38" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="302" cy="222" r="10" fill="#93c5fd" opacity="0.75"/>
    <text x="316" y="321" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Visible camera</text>
    <text x="316" y="343" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">operator context + registration</text>
  </g>

  <!-- LWIR aperture -->
  <g>
    <circle cx="564" cy="258" r="92" fill="#cbd5e1" stroke="#334155" stroke-width="4"/>
    <circle cx="564" cy="258" r="72" fill="url(#lens)" stroke="#020617" stroke-width="5"/>
    <circle cx="538" cy="230" r="15" fill="#7dd3fc" opacity="0.65"/>
    <circle cx="588" cy="292" r="24" fill="#0ea5e9" opacity="0.18"/>
    <text x="564" y="382" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f172a">LWIR methane aperture</text>
    <text x="564" y="404" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">lens → 7.675 µm CH₄ filter → detector</text>
  </g>

  <!-- Alignment centerline -->
  <g stroke="#2563eb" stroke-width="2" stroke-dasharray="8 7" opacity="0.75">
    <line x1="316" y1="236" x2="564" y2="258"/>
    <line x1="564" y1="124" x2="564" y2="410"/>
  </g>
  <text x="438" y="226" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2563eb">boresight calibration</text>

  <!-- Callout -->
  <path d="M660 226 C726 212 794 194 846 154" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="714" y="104" width="202" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="815" y="130" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Methane-specific path</text>
    <text x="815" y="151" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1d4ed8">verify 7.6–7.8 µm throughput</text>
  </g>

  <!-- Bottom note -->
  <text x="480" y="482" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748b">Prototype front plate: serviceable optics, rigid visible/LWIR alignment, vibration-isolated mount above.</text>
</svg>
