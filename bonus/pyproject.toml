[project]
name = "methane-ogi-bonus"
version = "0.1.0"
description = "Bonus simulation and detection-pipeline demo for the methane-OGI tech-assignment deliverable"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-ra"
